name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Baselines and release gates
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable baseline and conformance fixtures
        run: |
          python3 scripts/verify-baseline.py
          python3 Conformance/validate-v1-config.py
          python3 Conformance/validate-v1-queue.py
          python3 Conformance/validate-v1-flags.py
          python3 Conformance/validate-v2-replay.py
      - name: Validate immutable historical evidence definitions
        run: python3 scripts/validate-upgrade-evidence.py
      - name: Enforce strict source scan
        run: |
          python3 scripts/zero-brand-scan.py --mode strict
          python3 scripts/verify-feature-flag-boundary.py
      - name: Test strict scanners, evidence, and release trust
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  ios:
    name: Tests, consumers, API, and artifacts
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: xcodebuild -version
      - name: Verify owned dependency-free package
        run: |
          swift package resolve
          swift package dump-package > "$PWD/.build/package-metadata.json"
          python3 scripts/verify-package-surface.py --mode strict "$PWD/.build/package-metadata.json"
          python3 scripts/verify-dependencies.py --mode strict
      - name: Prepare iOS simulator
        run: |
          simulator_udid="$(xcrun simctl create 'ELU SDK Tests' 'iPhone 16 Pro')"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "ELU_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
      - name: Swift unit and concurrency tests
        run: |
          xcodebuild test \
            -scheme EluAnalytics \
            -destination "id=$ELU_SIMULATOR_UDID" \
            -derivedDataPath "$PWD/.build/test-derived-data" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Build public interface and symbol graph
        run: |
          mkdir -p "$PWD/.build/symbol-graphs"
          xcodebuild build \
            -scheme EluAnalytics \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/.build/interface-derived-data" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            OTHER_SWIFT_FLAGS="-emit-symbol-graph -emit-symbol-graph-dir $PWD/.build/symbol-graphs"
          python3 scripts/verify-symbol-graph.py "$PWD/.build/symbol-graphs"
      - name: Build UIKit and SwiftUI consumers
        working-directory: Fixtures/Consumers
        run: |
          xcodebuild build \
            -scheme UIKitConsumer \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/../../.build/uikit-consumer-derived-data" \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -scheme SwiftUIConsumer \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/../../.build/swiftui-consumer-derived-data" \
            CODE_SIGNING_ALLOWED=NO
      - name: Generate source archive and release evidence
        run: |
          mkdir -p "$PWD/.build/artifacts"
          git archive \
            --format=zip \
            --prefix=elu-ios-source/ \
            --output="$PWD/.build/artifacts/elu-ios-source.zip" \
            HEAD
          python3 scripts/generate-release-evidence.py \
            --output "$PWD/.build/release-evidence" \
            --artifact "$PWD/.build/artifacts/elu-ios-source.zip" \
            --artifact "$PWD/.build/interface-derived-data/Build/Products"
          (cd "$PWD/.build/release-evidence" && shasum -a 256 -c SHA256SUMS)
      - name: Enforce strict artifact scan
        run: |
          python3 scripts/zero-brand-scan.py --mode strict \
            --input "$PWD/.build/artifacts/elu-ios-source.zip" \
            --input "$PWD/.build/interface-derived-data/Build/Products" \
            --input "$PWD/.build/symbol-graphs" \
            --input "$PWD/.build/release-evidence"
      - name: Delete iOS simulator
        if: always() && env.ELU_SIMULATOR_UDID != ''
        run: xcrun simctl delete "$ELU_SIMULATOR_UDID"

  upgrade-evidence:
    name: Clean install and owned-store upgrades
    needs: validation
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare iOS simulator
        run: |
          simulator_udid="$(xcrun simctl create 'ELU Storage Compatibility' 'iPhone 16 Pro')"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "ELU_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
      - name: Verify owned persistence and unsupported-store refusal
        run: |
          xcodebuild test \
            -scheme EluAnalytics \
            -destination "id=$ELU_SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/elu-storage-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/elu-storage.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:EluAnalyticsTests/EluSQLiteRuntimeQueueTests \
            -only-testing:EluAnalyticsTests/EluV1CaptureRuntimeTests \
            -only-testing:EluAnalyticsTests/EluV2ReplayStorageTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Delete iOS simulator
        if: always() && env.ELU_SIMULATOR_UDID != ''
        run: xcrun simctl delete "$ELU_SIMULATOR_UDID"
