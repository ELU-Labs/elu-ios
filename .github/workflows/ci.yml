name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Baselines and release gates
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable baseline and conformance fixtures
        run: |
          python3 scripts/verify-baseline.py
          python3 Conformance/validate-v1-config.py
      - name: Validate upgrade evidence definitions
        run: python3 scripts/validate-upgrade-evidence.py
      - name: Enforce source scan baseline
        run: python3 scripts/zero-brand-scan.py --mode baseline
      - name: Test strict scanners, evidence, and release trust
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  ios:
    name: Tests, consumers, API, and artifacts
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: xcodebuild -version
      - name: Resolve and verify exact dependency
        run: |
          swift package resolve
          swift package dump-package > "$PWD/.build/package-metadata.json"
          python3 scripts/verify-package-surface.py "$PWD/.build/package-metadata.json"
          python3 scripts/verify-dependencies.py --mode baseline
      - name: Prepare iOS simulator
        run: |
          simulator_udid="$(xcrun simctl create 'ELU SDK Tests' 'iPhone 16 Pro')"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "ELU_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
      - name: Swift unit and concurrency tests
        run: |
          xcodebuild test \
            -scheme EluAnalytics \
            -destination "id=$ELU_SIMULATOR_UDID" \
            -derivedDataPath "$PWD/.build/test-derived-data" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Build public interface and symbol graph
        run: |
          mkdir -p "$PWD/.build/symbol-graphs"
          xcodebuild build \
            -scheme EluAnalytics \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/.build/interface-derived-data" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            OTHER_SWIFT_FLAGS="-emit-symbol-graph -emit-symbol-graph-dir $PWD/.build/symbol-graphs"
          python3 scripts/verify-symbol-graph.py "$PWD/.build/symbol-graphs"
      - name: Build UIKit and SwiftUI consumers
        working-directory: Fixtures/Consumers
        run: |
          xcodebuild build \
            -scheme UIKitConsumer \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/../../.build/uikit-consumer-derived-data" \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -scheme SwiftUIConsumer \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/../../.build/swiftui-consumer-derived-data" \
            CODE_SIGNING_ALLOWED=NO
      - name: Generate source archive and release evidence
        run: |
          mkdir -p "$PWD/.build/artifacts"
          git archive \
            --format=zip \
            --prefix=elu-ios-source/ \
            --output="$PWD/.build/artifacts/elu-ios-source.zip" \
            HEAD
          python3 scripts/generate-release-evidence.py \
            --output "$PWD/.build/release-evidence" \
            --artifact "$PWD/.build/artifacts/elu-ios-source.zip" \
            --artifact "$PWD/.build/interface-derived-data/Build/Products"
          (cd "$PWD/.build/release-evidence" && shasum -a 256 -c SHA256SUMS)
      - name: Report artifact scan findings
        run: |
          python3 scripts/zero-brand-scan.py --mode report \
            --input "$PWD/.build/artifacts/elu-ios-source.zip" \
            --input "$PWD/.build/interface-derived-data/Build/Products" \
            --input "$PWD/.build/symbol-graphs" \
            --input "$PWD/.build/release-evidence"
      - name: Delete iOS simulator
        if: always() && env.ELU_SIMULATOR_UDID != ''
        run: xcrun simctl delete "$ELU_SIMULATOR_UDID"

  upgrade-evidence:
    name: 0.1.0 simulator upgrade evidence
    needs: validation
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate checked evidence definitions
        run: python3 scripts/validate-upgrade-evidence.py
      - name: Run same-container simulator upgrade
        continue-on-error: true
        run: |
          python3 scripts/run-upgrade-evidence.py \
            --output "$RUNNER_TEMP/elu-ios-upgrade-evidence" \
            --custody runner-transient
      - name: Validate generated evidence shape
        if: always()
        run: |
          python3 scripts/validate-upgrade-evidence.py \
            --manifest "$RUNNER_TEMP/elu-ios-upgrade-evidence/manifest.json"
      - name: Require verified upgrade evidence
        if: always()
        run: |
          python3 scripts/validate-upgrade-evidence.py \
            --manifest "$RUNNER_TEMP/elu-ios-upgrade-evidence/manifest.json" \
            --raw-archive "$RUNNER_TEMP/elu-ios-upgrade-evidence/raw-evidence.tar.gz" \
            --require-verified
      - name: Discard raw simulator capture
        if: always()
        run: rm -f "$RUNNER_TEMP/elu-ios-upgrade-evidence/raw-evidence.tar.gz"
